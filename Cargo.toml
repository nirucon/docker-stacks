[package]
name = "docker-stacks"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A fast terminal manager for Docker Compose stacks, containers, images, volumes and networks, in the NIRUX style"
license = "MIT"
repository = "https://github.com/nirucon/docker-stacks"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
libc = "0.2"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
